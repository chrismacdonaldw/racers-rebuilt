name: Feature request
description: A new setting, enhancement, or mod hook.
labels: ["type: feat", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should racers-rebuilt do instead? Bullets are fine.
    validations:
      required: true
  - type: dropdown
    id: gameplay
    attributes:
      label: Does it change gameplay from the original?
      description: Changes to gameplay ship as opt-in settings, off by default.
      options:
        - "No"
        - Yes, as an opt-in setting
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or existing workarounds.
