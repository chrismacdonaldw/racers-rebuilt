name: Bug report
description: Something crashes, looks wrong, or behaves differently from the original game.
labels: ["type: fix", "status: triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One or two sentences. Add a screenshot or clip if it helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from launch. Name the track, settings and framerate.
      placeholder: |
        1. Launch racers-rebuilt
        2. Set the framerate to 144 FPS
        3. Start a race on Royal Knights Raceway
        4. Fire a power-up
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, or what the original game does.
    validations:
      required: true
  - type: dropdown
    id: original
    attributes:
      label: Does the original game do this?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: racers-rebuilt version
      placeholder: v0.1.0, or a commit hash
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 24H2, RTX 3070, 144 Hz display
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the log from the session that showed the bug.
      render: text
